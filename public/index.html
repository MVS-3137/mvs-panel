<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel MVS</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c1322; --bg2:#101a2d; --card:#14203a; --card2:#192842; --line:#24365a;
  --gold:#dda061; --gold2:#b98447; --gold-dim:#dda06126; --text:#ecdfcb; --muted:#9ba6bb;
  --ok:#7fc29b; --warn:#e8b54a; --bad:#e2735f;
  --malvel:#d9775f; --virtuoso:#dda061; --saito:#7fa8de;
  --r:14px; --head:Oswald,"Arial Narrow","Roboto Condensed",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif;
  background-image:radial-gradient(1200px 500px at 50% -200px,#1a2a4a 0%,transparent 70%);min-height:100vh}
h1,h2,h3,.oswald{font-family:var(--head);letter-spacing:.04em;text-transform:uppercase;font-weight:600;margin:0}
a{color:var(--gold)}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 60px}

/* header */
header{display:flex;align-items:center;gap:16px;padding:18px 0 14px;border-bottom:1px solid var(--line)}
header img{width:64px;height:64px;border-radius:12px;border:1px solid var(--gold2);box-shadow:0 0 0 4px #dda06114}
header h1{font-size:26px;color:var(--gold);line-height:1.1}
header .sub{color:var(--muted);font-size:13px}
header .me{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}

nav{display:flex;gap:6px;overflow-x:auto;padding:12px 0;scrollbar-width:none}
nav button{background:none;border:1px solid transparent;border-radius:999px;padding:7px 14px;cursor:pointer;
  font-family:var(--head);letter-spacing:.06em;text-transform:uppercase;font-size:14px;color:var(--muted);white-space:nowrap}
nav button.on{color:var(--bg);background:var(--gold)}
nav button:not(.on):hover{border-color:var(--line);color:var(--text)}
nav button .lock{font-size:11px;opacity:.7;margin-left:4px}

.demo{background:#e8b54a1c;border:1px dashed var(--warn);color:var(--warn);padding:8px 12px;border-radius:10px;font-size:13px;margin:6px 0 12px}

.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h2{font-size:17px;color:var(--gold);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h2 .hint{margin-left:auto;font-family:Inter;text-transform:none;letter-spacing:0;font-weight:400;font-size:12px;color:var(--muted)}
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start}
@media (max-width:900px){.g3,.g2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:480px){form .row{grid-template-columns:minmax(0,1fr)}.qi{grid-template-columns:60px minmax(0,1fr)}.qi .act{grid-column:1/-1;justify-content:flex-end}header h1{font-size:21px}header .me{display:none}}

/* member cards */
.mem{position:relative;overflow:hidden}
.mem::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c)}
.mem .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--head);font-weight:700;
  background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c);border:1px solid var(--c);flex:none}
.mem .name{font-family:var(--head);font-size:19px;letter-spacing:.05em}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em}
.p-work{background:#7fc29b22;color:var(--ok)} .p-rest{background:#7fa8de22;color:#7fa8de}
.p-leave{background:#e8b54a22;color:var(--warn)} .p-idle{background:#9ba6bb22;color:var(--muted)}
.mem .title{font-weight:600;margin:4px 0 2px}
.mem .meta{color:var(--muted);font-size:13px}
.count{font-family:var(--head);font-size:30px;line-height:1;margin-top:10px}
.count small{font-size:13px;color:var(--muted);font-family:Inter;margin-left:4px}
.bar{height:6px;background:#0008;border-radius:9px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:9px}

/* queue */
.q{display:flex;flex-direction:column;gap:8px}
.qi{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.qi .d{text-align:center;border-right:1px solid var(--line);padding-right:10px}
.qi .d b{display:block;font-family:var(--head);font-size:22px;line-height:1;color:var(--gold)}
.qi .d span{font-size:11px;color:var(--muted);text-transform:uppercase}
.qi .t{font-weight:600}
.qi .s{font-size:12.5px;color:var(--muted)}
.qi .tag{font-size:11px;padding:1px 7px;border-radius:6px;border:1px solid var(--line);margin-left:6px;color:var(--muted)}
.qi .act{display:flex;gap:6px}
.warnline{color:var(--warn);font-size:12.5px}
.badline{color:var(--bad);font-size:12.5px}
.gap{border-style:dashed;border-color:var(--bad);background:#e2735f10;grid-template-columns:76px 1fr}

.btn{background:var(--gold);color:#1a1206;border:0;border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn:hover{background:#e8b077}
.btn.ghost{background:none;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--gold2)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;padding:2px 6px;border-radius:6px}
.x:hover{color:var(--bad);background:#e2735f18}

form .row{display:grid;gap:10px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);margin-bottom:10px}
form .row.one{grid-template-columns:1fr}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
label.chk{flex-direction:row;align-items:center;gap:8px;font-size:13.5px;color:var(--text)}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
input:focus,select:focus{outline:2px solid var(--gold2);outline-offset:-1px}
input[type=checkbox]{accent-color:var(--gold);width:16px;height:16px}

.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--bg2);font-size:13.5px}
.li .dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.li .grow{flex:1;min-width:0}
.li .grow b{font-weight:600}
.empty{color:var(--muted);font-size:13px;padding:6px 2px}

.locked{display:grid;place-items:center;text-align:center;min-height:320px;gap:10px}
.locked .big{font-size:46px}
.locked p{color:var(--muted);max-width:460px;margin:0 auto}

dialog{background:var(--card);color:var(--text);border:1px solid var(--gold2);border-radius:var(--r);padding:20px;width:min(440px,92vw)}
dialog::backdrop{background:#000a}
dialog h3{color:var(--gold);margin-bottom:12px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--gold2);padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.help{font-size:12.5px;color:var(--muted);margin-top:8px}
/* ---- etap 2 ---- */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.chip.on{border-color:var(--gold);color:var(--gold);background:var(--gold-dim)}
.chan{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.chan .big{font-family:var(--head);font-size:30px;color:var(--gold);line-height:1}
.chan .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.chan .sp{flex:1}
.vlist{display:flex;flex-direction:column;gap:8px}
.vi{display:grid;grid-template-columns:136px minmax(0,1fr) 170px;gap:14px;align-items:center;padding:10px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);position:relative}
.vi.rec{border-color:var(--gold);box-shadow:0 0 0 1px #dda06155,0 0 22px -6px #dda061aa}
.th{width:136px;aspect-ratio:16/9;border-radius:8px;object-fit:cover;background:linear-gradient(135deg,#24365a,#14203a);display:grid;place-items:center;color:var(--muted);font-family:var(--head);font-size:13px}
.vi .t{font-weight:600;line-height:1.3}
.vi .s{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.vi .who{font-weight:600}
.vi select{padding:3px 6px;font-size:12.5px;border-color:var(--warn)}
.tg{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:6px;border:1px solid var(--line);text-transform:uppercase;letter-spacing:.04em}
.tg.wt{color:var(--ok);border-color:#7fc29b55}.tg.sh{color:#7fa8de;border-color:#7fa8de55}
.score{text-align:right}
.score b{display:block;font-family:var(--head);font-size:30px;line-height:1}
.score span{font-size:11.5px;color:var(--muted);display:block;margin-top:3px}
.vi a,.champ a{text-decoration:none}
.up{color:var(--ok)}.mid{color:var(--gold)}.down{color:var(--bad)}
.rekord{display:inline-block;font-family:var(--head);letter-spacing:.1em;font-size:12px;padding:2px 9px;border-radius:6px;color:#1a1206;font-weight:700;
  background:linear-gradient(110deg,#b98447 0%,#dda061 35%,#fff4dc 50%,#dda061 65%,#b98447 100%);background-size:250% 100%;animation:shine 2.4s linear infinite}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
.fire{font-size:12px;color:var(--warn);font-weight:600}
.rgrid{display:grid;gap:14px;grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1000px){.rgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.rgrid{grid-template-columns:minmax(0,1fr)}.vi{grid-template-columns:96px minmax(0,1fr)}.th{width:96px}.score{grid-column:1/-1;text-align:left;display:flex;align-items:baseline;gap:8px}.score b{display:inline;font-size:24px}}
.champ img,.champ .th{width:100%}
.champ .views{font-family:var(--head);font-size:30px;color:var(--gold);line-height:1;margin-top:10px}
.champ .t{font-weight:600;margin-top:6px;line-height:1.3}
.champ .m{font-size:12.5px;color:var(--muted)}
.rk{display:flex;gap:8px;font-size:13px;padding:6px 0;border-top:1px solid var(--line)}
.rk i{font-style:normal;color:var(--muted);width:18px}
.rk .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.news{display:flex;flex-direction:column;gap:8px}
.ni{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.ni .ic{font-size:20px;line-height:1.2;flex:none}
.ni .tx{flex:1;min-width:0}
.ni .tm{font-size:12px;color:var(--muted);margin-top:2px}
.ni.record,.ni.achievement{border-color:var(--gold)}.ni.revival{border-color:#e8b54a88}.ni.unassigned{border-color:#7fa8de88}.ni.error{border-color:var(--bad)}
.connect{text-align:center;padding:30px 16px}
.connect p{color:var(--muted);max-width:520px;margin:8px auto 16px}
nav button.unread{color:#fff;background:#e2735f;border-color:#e2735f;animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{0%,100%{box-shadow:0 0 0 0 #e2735f66}50%{box-shadow:0 0 0 6px #e2735f00}}
.navdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bad);margin-left:6px;vertical-align:middle}
/* ---- etap 3: wyzwania ---- */
.goalhead{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.goalhead .gl{flex:1;min-width:220px}
.goalhead .big{font-family:var(--head);font-size:34px;color:var(--gold);line-height:1}
.goalhead .stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:10px}
.goalhead .stats div{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.goalhead .stats b{display:block;font-family:var(--head);font-size:22px;color:var(--text);letter-spacing:.02em;text-transform:none}
.tipwrap{position:relative;display:inline-block}
.tipwrap .tipbox{position:absolute;right:0;top:calc(100% + 8px);width:250px;background:var(--card2);border:1px solid var(--warn);color:var(--text);font-size:12.5px;line-height:1.45;padding:9px 11px;border-radius:10px;opacity:0;pointer-events:none;transform:translateY(-4px);transition:.15s;z-index:5;box-shadow:0 10px 30px #0008}
.tipwrap:hover .tipbox,.tipwrap:focus-within .tipbox{opacity:1;transform:none}
.chartbox{margin-top:14px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 6px 4px}
.chartbox svg{display:block;width:100%;height:auto}
.eta{margin-top:12px;font-size:14.5px}
.eta b{color:var(--gold)}
.rarity{margin-top:18px}
.rarity h3{font-size:15px;display:flex;align-items:center;gap:10px;margin-bottom:10px;color:var(--rc)}
.rarity h3 span{font-family:Inter;font-weight:500;font-size:12px;color:var(--muted);text-transform:none;letter-spacing:0}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px}
.ach{position:relative;text-align:center;padding:12px 6px 10px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);outline:none;cursor:default}
.ach:hover,.ach:focus{border-color:var(--rc)}
.ach svg{width:78px;height:78px;display:block;margin:0 auto}
.ach .an{font-size:12.5px;font-weight:600;line-height:1.25;margin-top:8px;min-height:2.5em}
.ach.lk .an{color:var(--muted);letter-spacing:.2em}
.ach.leg:not(.lk) svg{filter:drop-shadow(0 0 8px #e8b54a88)}
.stamp{position:absolute;top:8px;right:-4px;transform:rotate(12deg);font-family:var(--head);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:1px 6px;border:2px solid var(--sc);color:var(--sc);border-radius:4px;background:#0c1322e6;box-shadow:0 2px 6px #0008;max-width:110px;line-height:1.3}
.ach .tipbox{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translate(-50%,4px);width:220px;background:var(--card2);border:1px solid var(--rc);
  color:var(--text);font-size:12.5px;line-height:1.45;padding:9px 11px;border-radius:10px;opacity:0;pointer-events:none;transition:.15s;z-index:6;text-align:left;box-shadow:0 10px 30px #0009}
.ach:hover .tipbox,.ach:focus .tipbox{opacity:1;transform:translate(-50%,0)}
.tipbox .rl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--rc);font-weight:700}
.tipbox .dt{color:var(--muted);font-size:11.5px;margin-top:4px}
.ach .unl{margin-top:6px}
@media (max-width:560px){.chartbox{overflow-x:auto}.chartbox svg{min-width:640px}.tipwrap .tipbox{left:0;right:auto}.achs{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}}
.prog{height:8px;background:#0008;border-radius:9px;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:9px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="logo.jpg" alt="Logo MVS">
    <div>
      <h1>Panel MVS</h1>
      <div class="sub">Malvel · Virtuoso · Saito</div>
    </div>
    <div class="me" id="me"></div>
  </header>

  <nav id="nav"></nav>
  <div id="demo"></div>
  <main id="view"></main>
</div>

<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>

<script>
"use strict";
const MEMBERS = ["Malvel","Virtuoso","Saito"];
const COLORS = {Malvel:"var(--malvel)",Virtuoso:"var(--virtuoso)",Saito:"var(--saito)"};
const DEFAULTS = {cadence:4, workPerMin:0.3, minWork:3, restPerMin:0.15};
const TABS = [
  {id:"plan", name:"Plan nagrywek"},
  {id:"perf", name:"Performance"},
  {id:"rec", name:"Rekordy MVS"},
  {id:"chal", name:"Wyzwania"},
  {id:"thumb", name:"Miniatury", stage:3, icon:"🖼️", text:"3 miniatury, które najlepiej przyciągały widzów, i generator promptu do AI w ich stylu."},
  {id:"news", name:"Aktualności"},
  {id:"tags", name:"Tagi", stage:3, icon:"🏷️", text:"Generator tagów na podstawie waszych najlepszych filmów i tytułu nowego."},
];

/* ---------- daty ---------- */
const DAY = 864e5;
const toD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(Date.UTC(y,m-1,d,12)); };
const toS = d => d.toISOString().slice(0,10);
const today = () => { const n = new Date(); return toS(new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate(),12))); };
const addDays = (s,n) => toS(new Date(toD(s).getTime()+n*DAY));
const diff = (a,b) => Math.round((toD(b)-toD(a))/DAY);
const maxS = (a,b) => a > b ? a : b;
const fmt = s => toD(s).toLocaleDateString("pl-PL",{day:"numeric",month:"short",timeZone:"UTC"});
const dow = s => toD(s).toLocaleDateString("pl-PL",{weekday:"short",timeZone:"UTC"});
function rel(n){
  if(n===0) return "dziś";
  if(n===1) return "jutro";
  if(n>1) return "za "+n+" dni";
  return (-n)+" "+(-n===1?"dzień":"dni")+" po terminie";
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- dane ---------- */
let S = {projects:[], leaves:[], settings:{...DEFAULTS}, me:""};
let DEMO = false;
let demoId = 100;

function demoData(){
  const t = today();
  return {
    me:"tryb podglądu",
    settings:{...DEFAULTS},
    projects:[
      {id:1,member:"Saito",title:"Tiger II – czy był aż tak straszny?",start:addDays(t,-6),planned_min:22,wt:1,status:"active"},
      {id:2,member:"Malvel",title:"Najgorsze samoloty 1. rangi",start:addDays(t,-2),planned_min:12,wt:1,status:"active"},
      {id:3,member:"Virtuoso",title:"Historia Leoparda 2 – pełny dokument",start:addDays(t,-15),planned_min:45,wt:1,status:"done",uploaded:addDays(t,-3),actual_min:44},
      {id:4,member:"Malvel",title:"5 czołgów, które grają się same",start:addDays(t,-12),planned_min:10,wt:1,status:"done",uploaded:addDays(t,-7),actual_min:9},
    ],
    leaves:[{id:1,member:"Saito",from_date:addDays(t,2),to_date:addDays(t,5),note:"wyjazd"}],
  };
}

const api = {
  async call(method, url, body){
    if(DEMO) return demoCall(method, url, body);
    const r = await fetch("/api/"+url,{method,headers:{"content-type":"application/json"},body:body?JSON.stringify(body):undefined});
    const j = await r.json().catch(()=>({}));
    if(r.status===401){ location.href="/login"; throw new Error("Zaloguj się ponownie"); }
    if(!r.ok) throw new Error(j.error || "Błąd zapisu");
    return j;
  }
};
function demoCall(method, url, body){
  const [res,id] = url.split("/");
  const list = res==="projects" ? S.projects : res==="leaves" ? S.leaves : null;
  if(res==="goal"){ C.goal = Number(body.goal); C.goal_set_at = new Date().toISOString(); C.points = [{ts:C.goal_set_at, subs:C.subs}]; return {}; }
  if(res==="achievements"){ C.unlocked[id] = {unlocked_at:new Date().toISOString(), members:id==="toss_coin"?[]:body.members}; return {}; }
  if(res==="settings"){ Object.assign(S.settings, Object.fromEntries(Object.entries(body).map(([k,v])=>[k,Number(v)]))); return {}; }
  if(method==="POST"){ const o={id:++demoId, status:"active", ...body}; list.push(o); return {id:o.id}; }
  if(method==="PUT"){ Object.assign(list.find(x=>x.id==id), body); return {}; }
  if(method==="DELETE"){ list.splice(list.findIndex(x=>x.id==id),1); return {}; }
}

async function load(){
  if(DEMO){ if(!Y.videos.length) Y = demoYT(); if(!C) C = demoChallenge(); render(); return; }
  try{
    const r = await fetch("/api/state",{cache:"no-store"});
    if(r.status===401){ location.href="/login"; return; }
    if(!r.ok) throw 0;
    const j = await r.json();
    S = {...j, settings:{...DEFAULTS, ...j.settings}};
  }catch{
    DEMO = true; S = demoData();
  }

/* ---------- algorytm deadline'ów ---------- */
function onLeave(member, day){
  return S.leaves.some(l => l.member===member && day>=l.from_date && day<=l.to_date);
}
function currentLeave(member, day){
  return S.leaves.find(l => l.member===member && day<=l.to_date && day>=l.from_date);
}
/* najwcześniejszy realny termin: start + N dni pracy, dni urlopu się nie liczą */
function earliestFinish(p){
  const st = S.settings;
  const need = Math.max(st.minWork, Math.ceil(p.planned_min*st.workPerMin));
  let d = p.start;
  let worked = 0, leaveDays = 0, guard = 0;
  while(worked < need && guard++ < 400){
    if(onLeave(p.member, d)) leaveDays++; else worked++;
    d = addDays(d,1);
  }
  return {date:addDays(d,-1), need, leaveDays};
}
function restOf(p){
  return Math.max(1, Math.round((p.actual_min || p.planned_min) * S.settings.restPerMin));
}
function schedule(){
  const st = S.settings, t = today();
  const done = S.projects.filter(p=>p.status==="done" && p.uploaded).sort((a,b)=>a.uploaded<b.uploaded?-1:1);
  const lastUpload = done.length ? done[done.length-1].uploaded : addDays(t,-st.cadence);
  const active = S.projects.filter(p=>p.status==="active").map(p=>({...p, ef:earliestFinish(p)}));
  // kolejność premier: kto najwcześniej realnie skończy, ten pierwszy
  active.sort((a,b)=> a.ef.date===b.ef.date ? (a.start<b.start?-1:1) : (a.ef.date<b.ef.date?-1:1));
  let prev = lastUpload;
  const out = [];
  for(const p of active){
    const slot = addDays(prev, st.cadence);        // kiedy kanał potrzebuje kolejnego filmu
    let deadline = maxS(slot, p.ef.date);          // nie wcześniej niż da się zrobić film
    // termin nie może wypaść w trakcie urlopu autora
    while(onLeave(p.member, deadline)) deadline = addDays(deadline,1);
    const gapDays = diff(prev, deadline) - st.cadence; // >0 = kanał będzie stał
    out.push({...p, slot, deadline, gapDays, prev});
    prev = deadline;
  }
  return {queue:out, lastUpload, done, nextNeeded:addDays(prev, st.cadence)};
}

function memberCard(m, queue, done, t){
  const c = COLORS[m];
  const proj = queue.find(p=>p.member===m);
  const leave = currentLeave(m, t);
  const last = [...done].reverse().find(p=>p.member===m);
  let pill, body;
  if(proj){
    const left = diff(t, proj.deadline);
    const total = Math.max(1, diff(proj.start, proj.deadline));
    const pct = Math.min(100, Math.max(0, Math.round(diff(proj.start, t)/total*100)));
    pill = leave ? `<span class="pill p-leave">Urlop do ${fmt(leave.to_date)}</span>` : `<span class="pill p-work">W produkcji</span>`;
    body = `<div class="title">${esc(proj.title)}</div>
      <div class="meta">start ${fmt(proj.start)} · ~${proj.planned_min} min${proj.wt?" · WT":""}</div>
      <div class="count" style="color:${left<0?"var(--bad)":left<=2?"var(--warn)":"var(--text)"}">${fmt(proj.deadline)}<small>${rel(left)}</small></div>
      <div class="bar"><i style="width:${pct}%"></i></div>`;
  } else if(leave){
    pill = `<span class="pill p-leave">Urlop</span>`;
    body = `<div class="meta">${leave.note?esc(leave.note)+" · ":""}wraca ${fmt(addDays(leave.to_date,1))}</div>`;
  } else if(last && diff(last.uploaded, t) < restOf(last)){
    const until = addDays(last.uploaded, restOf(last));
    pill = `<span class="pill p-rest">Odpoczynek</span>`;
    body = `<div class="meta">po „${esc(last.title)}” (${last.actual_min||last.planned_min} min)</div>
      <div class="count">${fmt(until)}<small>${rel(diff(t,until))} koniec przerwy</small></div>`;
  } else {
    pill = `<span class="pill p-idle">Wolny</span>`;
    body = `<div class="meta">Brak filmu w planie. Czas coś wziąć!</div>`;
  }
  return `<div class="card mem" style="--c:${c}">
    <div class="top"><div class="av">${m[0]}</div><div><div class="name">${m}</div>${pill}</div></div>${body}</div>`;
}

/* ---------- etap 2: YouTube ---------- */
const CP = [...Array.from({length:48},(_,i)=>i+1), ...Array.from({length:26},(_,i)=>(i+3)*24)];
const WIN = [{h:24,n:"24 godziny"},{h:168,n:"7 dni"},{h:336,n:"14 dni"},{h:672,n:"28 dni"}];
let Y = {connected:false, videos:[], news:[], channel:{}};
let VF = "all", RF = "wt", VSHOW = 25;
const HOURMS = 36e5;
const ageH = v => (Date.now() - Date.parse(v.published)) / HOURMS;
const nf = n => n == null ? "–" : Number(n).toLocaleString("pl-PL");
const cat = v => v.is_short ? "short" : v.wt ? "wt" : "other";
const CATN = {wt:"War Thunder", other:"inne", short:"shorty"};
function cAt(curve, h){
  if(!curve) return null;
  if(h <= CP[0]) return curve[0]==null ? null : Math.round(curve[0]*h);
  for(let i=1;i<CP.length;i++) if(h <= CP[i]){
    const a=curve[i-1], b=curve[i]; if(a==null||b==null) return null;
    return Math.round(a + (b-a)*(h-CP[i-1])/(CP[i]-CP[i-1]));
  }
  return curve[curve.length-1];
}
const recVal = (v,h) => v.manual && v.manual[h] != null ? v.manual[h] : cAt(v.curve,h);
const vAt = (v,h) => h >= ageH(v) - 0.5 ? v.views : cAt(v.curve,h);
function relTime(iso){
  const m = Math.round((Date.now()-Date.parse(iso))/6e4);
  if(m < 2) return "przed chwilą"; if(m < 60) return m+" min temu";
  const h = Math.round(m/60); if(h < 24) return h+" godz. temu";
  const d = Math.round(h/24); return d === 1 ? "wczoraj" : d+" dni temu";
}
function ageTxt(h){ return h < 48 ? Math.round(h)+" godz." : Math.round(h/24)+" dni"; }
function median(a){ const s=[...a].sort((x,y)=>x-y), m=s.length>>1; return s.length%2 ? s[m] : (s[m-1]+s[m])/2; }

function scoreOf(v){
  const A = ageH(v), h = Math.min(A, 672);
  const x = A <= 672 ? v.views : (cAt(v.curve,672) ?? v.views);
  const pick = sameCat => Y.videos.filter(o => o.id!==v.id && o.published < v.published && (sameCat ? cat(o)===cat(v) : !o.is_short) && ageH(o) >= h)
    .map(o => vAt(o,h)).filter(n => n != null).slice(0,10);
  let peers = pick(true), mixed = false;
  if(peers.length < 3 && !v.is_short){ peers = pick(false); mixed = true; }
  if(peers.length < 3) return null;
  const base = median(peers);
  return {pct: base > 0 ? Math.round(x/base*100) : null, base: Math.round(base), h, n: peers.length, mixed};
}
function recordTable(filter){
  const pool = Y.videos.filter(v => !v.is_short && (filter==="all" || cat(v)===filter));
  return WIN.map(w => ({...w, list: pool.map(v => ({v, n: recVal(v,w.h)})).filter(x => x.n != null).sort((a,b)=>b.n-a.n).slice(0,5)}));
}
function recordFlags(){
  const holders = {}, hot = new Map();
  for(const c of ["wt","other"]) for(const w of recordTable(c)) if(w.list[0]) (holders[w.list[0].v.id] ||= []).push(w.n);
  // „na drodze do rekordu”: obecne wyświetlenia × typowy przyrost kanału od tego wieku do 24 h / 7 / 14 / 28 dni
  for(const v of Y.videos){
    const A = ageH(v); if(v.is_short || A >= 672 || A < 6 || !v.views) continue;
    const same = Y.videos.filter(o => o.id!==v.id && !o.is_short && cat(o)===cat(v));
    const hits = [];
    for(const w of WIN){
      if(w.h <= A) continue;
      const ratios = same.map(o => { const a = cAt(o.curve,A), b = cAt(o.curve,w.h); return a>0 && b!=null ? b/a : null; }).filter(r=>r!=null).slice(0,15);
      if(ratios.length < 5) continue;
      const proj = Math.round(v.views * median(ratios));
      const rec = Math.max(0, ...same.map(o => recVal(o,w.h)).filter(n=>n!=null));
      if(rec > 0 && proj > rec) hits.push({n:w.n, proj, rec});
    }
    if(hits.length) hot.set(v.id, hits);
  }
  return {holders, hot};
}

function perfView(){
  if(!Y.connected && !DEMO) return connectView();
  const {holders, hot} = recordFlags();
  const list = Y.videos.filter(v => VF==="all" ? true : cat(v)===VF);
  const chips = [["all","Wszystkie"],["wt","War Thunder"],["other","Inne"],["short","Shorty"]]
    .map(([k,n])=>`<button class="chip ${VF===k?"on":""}" data-vf="${k}">${n}</button>`).join("");
  const rows = list.slice(0, VSHOW).map(v => {
    const s = scoreOf(v), A = ageH(v);
    const cls = !s || s.pct==null ? "" : s.pct >= 120 ? "up" : s.pct >= 80 ? "mid" : "down";
    const rec = holders[v.id];
    return `<div class="vi ${rec?"rec":""}">
      <a href="https://youtu.be/${esc(v.id)}" target="_blank" rel="noopener">${thumb(v)}</a>
      <div><div class="t">${esc(v.title)}</div>
        <div class="s">${whoCell(v)}<span>${ageTxt(A)} temu</span><span>${nf(v.views)} wyśw.</span>
          ${v.is_short?'<span class="tg sh">short</span>':v.wt?'<span class="tg wt">WT</span>':'<span class="tg">inne</span>'}
          ${rec?`<span class="rekord">REKORD ${rec.map(r=>r.replace(" godziny","H").toUpperCase()).join(" · ")}</span>`:""}
          ${hot.has(v.id)?`<span class="fire" title="${hot.get(v.id).map(x=>`${x.n}: prognoza ~${nf(x.proj)}, rekord ${nf(x.rec)}`).join(" · ")}">📈 na drodze do rekordu ${hot.get(v.id).map(x=>x.n.replace(" godziny"," h")).join(", ")} (~${nf(hot.get(v.id).at(-1).proj)} vs ${nf(hot.get(v.id).at(-1).rec)})</span>`:""}</div></div>
      <div class="score">${s && s.pct!=null ? `<b class="${cls}">${s.pct}%</b><span>typowo ${nf(s.base)} po ${ageTxt(s.h)}<br>(mediana ${s.n} ost. ${s.mixed?"filmów":CATN[cat(v)]})</span>` : `<span>za mało danych do porównania</span>`}</div>
    </div>`;
  }).join("");
  return `${chanBar()}<div class="card" style="margin-top:14px"><h2>Performance filmów <span class="hint">100% = typowy wynik kanału w tym samym wieku filmu</span></h2>
    <div class="chips">${chips}</div><div class="vlist">${rows || '<div class="empty">Brak filmów w tej kategorii.</div>'}</div>
    ${list.length > VSHOW ? `<div style="text-align:center;margin-top:12px"><button class="btn ghost sm" data-more>Pokaż więcej</button></div>` : ""}</div>`;
}
function recView(){
  if(!Y.connected && !DEMO) return connectView();
  const chips = [["wt","War Thunder"],["other","Inne gry"],["all","Wszystkie"]]
    .map(([k,n])=>`<button class="chip ${RF===k?"on":""}" data-rf="${k}">${n}</button>`).join("");
  const cards = recordTable(RF).map(w => {
    const [top, ...rest] = w.list;

function demoChallenge(){
  const now = Date.now(), wk = 7*864e5;
  const mon = new Date(now); mon.setUTCHours(6,0,0,0); mon.setUTCDate(mon.getUTCDate() - ((mon.getUTCDay()+6)%7));
  const pts = [{ts:new Date(mon - 5*wk + 3*864e5).toISOString(), subs:11240}];
  [11290,11410,11480,11590,11700].forEach((s,i)=>pts.push({ts:new Date(mon - (4-i)*wk).toISOString(), subs:s}));
  const ago = d => new Date(now - d*864e5).toISOString();
  return {me:"tryb podglądu", goal:20000, goal_set_at:pts[0].ts, subs:11740, rate28:16.4, points:pts, manual:{dangerous_alone:["Saito"], toss_coin:["Saito"]},
    defs: DEMO_DEFS, unlocked:{
      first_blood:{unlocked_at:ago(30),members:["Saito"]}, level_up:{unlocked_at:ago(3),members:[]}, samurai:{unlocked_at:ago(12),members:["Malvel"]},
      repair_cost:{unlocked_at:ago(9),members:["Virtuoso"]}, gotta_catch:{unlocked_at:ago(6),members:["Saito","Malvel","Virtuoso"]},
      war_never_changes:{unlocked_at:ago(4),members:["Saito"]}, papiez:{unlocked_at:ago(1),members:["Virtuoso"]}}};
}

function goalChart(c){
  const pts = c.points.map(p=>({t:Date.parse(p.ts), s:p.subs}));
  if(c.subs != null && pts.length) pts.push({t:Date.now(), s:c.subs, now:true});
  if(!pts.length) return `<div class="empty">Wykres zacznie się rysować po pierwszym odświeżeniu danych z kanału.</div>`;
  const W=900, H=300, L=62, R=24, T=22, B=40;
  const t0 = pts[0].t, last = pts[pts.length-1];
  const left = c.goal - last.s, rate = c.rate28;
  const eta = left <= 0 ? last.t : rate > 0 ? last.t + left/rate*864e5 : null;
  let t1 = Math.max(eta || 0, t0 + 8*7*864e5, last.t + 14*864e5);
  if(eta) t1 = Math.max(t1, eta + 7*864e5);
  if(t1 - t0 > 5*365*864e5) t1 = t0 + 5*365*864e5; // max 5 lat na osi
  const sMin = Math.min(...pts.map(p=>p.s)), span = c.goal - sMin;
  const yMin = Math.max(0, Math.floor((sMin - span*.06)/100)*100), yMax = Math.ceil((c.goal + span*.06)/100)*100;
  const X = t => L + (t - t0)/(t1 - t0)*(W-L-R), Yp = s => T + (1 - (s - yMin)/(yMax - yMin))*(H-T-B);
  // poniedziałki na osi X
  const m = new Date(t0); m.setUTCHours(12,0,0,0); m.setUTCDate(m.getUTCDate() + ((8 - m.getUTCDay())%7));
  const mondays = []; for(let t=m.getTime(); t<=t1; t+=7*864e5) mondays.push(t);
  const every = Math.max(1, Math.ceil(mondays.length/10));
  const fmtD = t => new Date(t).toLocaleDateString("pl-PL",{day:"numeric",month:"short",timeZone:"Europe/Warsaw"});
  let g = "";
  // siatka Y
  const step = Math.max(100, Math.round((yMax-yMin)/5/500)*500 || 100);
  for(let s=Math.ceil(yMin/step)*step; s<=yMax; s+=step) g += `<line x1="${L}" x2="${W-R}" y1="${Yp(s)}" y2="${Yp(s)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${Yp(s)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${nf(s)}</text>`;
  mondays.forEach((t,i)=>{ g += `<line x1="${X(t)}" x2="${X(t)}" y1="${T}" y2="${H-B}" stroke="var(--line)" stroke-opacity="${i%every?0:.5}" stroke-dasharray="2 4"/>`;
    if(i%every===0) g += `<text x="${X(t)}" y="${H-B+18}" text-anchor="middle" font-size="11" fill="var(--muted)">${fmtD(t)}</text>`; });
  // cel
  g += `<line x1="${L}" x2="${W-R}" y1="${Yp(c.goal)}" y2="${Yp(c.goal)}" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="${W-R}" y="${Yp(c.goal)-7}" text-anchor="end" font-size="12" font-weight="700" fill="var(--bad)">CEL ${nf(c.goal)}</text>`;
  // prognoza
  if(eta && left > 0) g += `<line x1="${X(last.t)}" y1="${Yp(last.s)}" x2="${X(Math.min(eta,t1))}" y2="${Yp(eta<=t1?c.goal:last.s+rate*(t1-last.t)/864e5)}" stroke="var(--gold)" stroke-width="2" stroke-dasharray="5 6" stroke-opacity=".7"/>
    ${eta<=t1?`<circle cx="${X(eta)}" cy="${Yp(c.goal)}" r="5" fill="none" stroke="var(--gold)" stroke-width="2"/>`:""}`;
  // wykres schodkowy: skok co tydzień
  const weekly = pts.filter(p=>!p.now);
  let d = `M${X(weekly[0].t)} ${Yp(weekly[0].s)}`;
  for(let i=1;i<weekly.length;i++) d += ` H${X(weekly[i].t)} V${Yp(weekly[i].s)}`;
  d += ` H${X(last.t)}`;
  const area = d + ` V${H-B} H${X(weekly[0].t)} Z`;
  g += `<path d="${area}" fill="var(--gold)" fill-opacity=".08"/><path d="${d}" fill="none" stroke="var(--gold)" stroke-width="3" stroke-linejoin="round"/>`;
  weekly.forEach(p => g += `<circle cx="${X(p.t)}" cy="${Yp(p.s)}" r="3.5" fill="var(--gold)"><title>${fmtD(p.t)}: ${nf(p.s)} subów</title></circle>`);
  g += `<circle cx="${X(last.t)}" cy="${Yp(last.s)}" r="5" fill="var(--bg)" stroke="var(--gold)" stroke-width="2.5"><title>teraz: ${nf(last.s)}</title></circle>`;
  return {svg:`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Wykres liczby subów do celu">${g}</svg>`, eta, left};
}

function challengeView(){
  if(!C) return `<div class="card"><div class="empty">Ładuję tablicę wyzwań…</div></div>`;
  if(!C.goal) return `<div class="card connect"><div style="font-size:42px">🎯</div><h2 style="justify-content:center">Tablica wyzwań startuje</h2>
    <p>Wszystko ruszy przy najbliższym odświeżeniu danych z kanału (co godzinę albo przyciskiem „Odśwież teraz” w Performance).</p></div>`;
  const ch = goalChart(C);
  const left = Math.max(0, C.goal - (C.subs||0));
  const pct = C.subs ? Math.min(100, C.subs/C.goal*100) : 0;
  const rate28 = C.rate28 != null ? Math.round(C.rate28*28) : null;
  let etaTxt;
  if(C.subs >= C.goal) etaTxt = `<b>Cel osiągnięty!</b> Ustawcie nowy przyciskiem „Zmień cel”.`;
  else if(!ch.eta) etaTxt = rate28 == null ? `Prognoza pojawi się, gdy panel pobierze przyrost subów z ostatnich 28 dni.` : `W ostatnich 28 dniach przybyło ${nf(rate28)} subów, więc przy tym tempie celu nie da się wyliczyć.`;
  else { const days = Math.round((ch.eta - Date.now())/864e5);
    etaTxt = `Przy obecnym tempie (+${nf(rate28)} subów w 28 dni) cel osiągniecie ok. <b>${new Date(ch.eta).toLocaleDateString("pl-PL",{day:"numeric",month:"long",year:"numeric"})}</b> (za ${nf(days)} dni).`; }
  const unl = C.unlocked || {};
  const count = Object.keys(unl).length;
  const groups = RAR.map(r => {
    const list = C.defs.filter(d=>d.rarity===r.id);
    const got = list.filter(d=>unl[d.id]).length;
    return `<div class="rarity" style="--rc:${r.c}"><h3>${r.n} <span>${got}/${list.length}</span></h3><div class="achs">${list.map(d=>achTile(d, unl[d.id], r)).join("")}</div></div>`;
  }).join("");
  return `<div class="card">
    <div class="goalhead"><div class="gl"><h2>Cel subów</h2><div class="big">${nf(C.goal)}</div>
      <div class="stats"><div>Teraz<b>${nf(C.subs)}</b></div><div>Brakuje<b>${nf(left)}</b></div><div>Ostatnie 28 dni<b>${rate28==null?"–":(rate28>=0?"+":"")+nf(rate28)}</b></div></div></div>
      <div class="tipwrap"><button class="btn ghost" data-goal>Zmień cel</button>
        <div class="tipbox">⚠ Uwaga: zmiana celu <b>resetuje wykres</b>. Zacznie się rysować od nowa, od dzisiejszej liczby subów.</div></div></div>
    <div class="prog"><i style="width:${pct.toFixed(1)}%"></i></div>
    <div class="chartbox">${typeof ch==="string"?ch:ch.svg}</div>
    <div class="eta">${etaTxt}</div>
    <div class="help">Linia skacze co tydzień (poniedziałek rano). Prognoza liczona z przyrostu subów w ostatnich 28 dniach (YouTube Analytics), odświeżana codziennie.</div>
  </div>
  <div class="card" style="margin-top:14px"><h2>Achievementy <span class="hint">${count}/${C.defs.length} odblokowanych · liczone od ${C.started?fmt(C.started.slice(0,10)):"startu tablicy"}</span></h2>${groups}</div>`;
}
function achTile(d, u, r){
  const leg = d.rarity==="legendary" ? " leg" : "";
  if(!u){
    const canUnlock = !DEMO && C.manual && C.manual[d.id] && C.manual[d.id].includes(C.me);
    return `<div class="ach lk${leg}" tabindex="0">${badge(d,false)}<div class="an">???</div>
      <div class="tipbox"><div class="rl">${r.n}</div>Ukryty achievement. Zdobądźcie go, żeby poznać nazwę.</div>
      ${canUnlock?`<button class="btn ghost sm unl" data-unlock="${d.id}">Odblokuj</button>`:""}</div>`;
  }
  const who = (u.members||[]).filter(Boolean);
  const sc = who.length===1 ? COLORS[who[0]] : "var(--gold)";
  const v = u.video_id && Y.videos ? Y.videos.find(x=>x.id===u.video_id) : null;
  return `<div class="ach${leg}" tabindex="0">${badge(d,true)}<div class="an">${esc(d.name)}</div>
    ${who.length?`<div class="stamp" style="--sc:${sc}">${who.length>=3?"Cała ekipa":who.map(esc).join(" & ")}</div>`:""}
    <div class="tipbox"><div class="rl">${r.n}</div>${esc(d.desc)}${v?`<div class="dt">Film: ${esc(v.title)}</div>`:""}<div class="dt">Zdobyty ${fmt(u.unlocked_at.slice(0,10))}${who.length?" · "+who.map(esc).join(" & "):""}</div></div></div>`;
}
function openGoal(){
  dlg.innerHTML = `<h3>Nowy cel subów</h3>
  <form id="fGoal"><div class="row one"><label>Cel (liczba subów)<input type="number" name="goal" min="1" step="1" value="${C.goal||20000}" required></label></div>
  <div class="warnline" style="margin-bottom:12px">Zmiana celu resetuje wykres: zacznie się rysować od nowa od dziś.</div>
  <button class="btn" type="submit">Ustaw cel</button> <button class="btn ghost" type="button" data-close>Anuluj</button></form>`;
  dlg.showModal();
}
function openUnlock(id){
  const d = C.defs.find(x=>x.id===id);
  dlg.innerHTML = id==="dangerous_alone" ? `<h3>${esc(d.name)}</h3><form id="fUnlock" data-id="${id}">
    <p class="help" style="margin-top:0">${esc(d.desc)} Zaznacz dwie osoby, które zrobiły film razem.</p>
    ${MEMBERS.map(m=>`<label class="chk" style="margin:6px 0"><input type="checkbox" name="m" value="${m}"> ${m}</label>`).join("")}
    <div style="margin-top:12px"><button class="btn" type="submit">Odblokuj</button> <button class="btn ghost" type="button" data-close>Anuluj</button></div></form>`
  : `<h3>${esc(d.name)}</h3><form id="fUnlock" data-id="${id}"><p class="help" style="margin-top:0">${esc(d.desc)} YouTube nie udostępnia tej liczby, więc odblokowujecie go ręcznie, gdy to się stanie.</p>
    <button class="btn" type="submit">Odblokuj</button> <button class="btn ghost" type="button" data-close>Anuluj</button></form>`;
  dlg.showModal();
}

/* ---------- akcje ---------- */
const formObj = f => Object.fromEntries(new FormData(f));
document.addEventListener("submit", e => {
  const f = e.target; e.preventDefault();
  const o = formObj(f);
  if(f.id==="fNew") save("POST","projects",{member:o.member,title:o.title,start:o.start,planned_min:Number(o.planned_min),wt:!!o.wt},"Film dodany do planu");
  if(f.id==="fLeave"){
    if(o.to_date < o.from_date) return toast("⚠ Data końca przed początkiem");
    save("POST","leaves",o,"Wolne zapisane");
  }
  if(f.id==="fGoal"){ dlg.close(); save("PUT","goal",{goal:Number(o.goal)},"Nowy cel ustawiony"); }
  if(f.id==="fUnlock"){ const ms = new FormData(f).getAll("m"); dlg.close(); save("POST","achievements/"+f.dataset.id+"/unlock",{members:ms},"Achievement odblokowany! 🏅"); }
  if(f.id==="fSet") save("PUT","settings",o,"Ustawienia zapisane");
  if(f.id==="fDone"){ dlg.close(); save("PUT","projects/"+f.dataset.id,{status:"done",uploaded:o.uploaded,actual_min:Number(o.actual_min),video_url:o.video_url||null},"Gratulacje, film wrzucony! 🎉"); }
  if(f.id==="fEdit"){ dlg.close(); save("PUT","projects/"+f.dataset.id,{member:o.member,title:o.title,start:o.start,planned_min:Number(o.planned_min),wt:!!o.wt},"Zmiany zapisane"); }
});
document.addEventListener("click", e => {
  const b = e.target.closest("button,[data-close]"); if(!b) return;
  const d = b.dataset;
  if(d.tab){ TAB = d.tab; history.replaceState(null,"","#"+TAB); render(); }
  if(d.vf){ VF = d.vf; VSHOW = 25; render(); }
  if(d.rf){ RF = d.rf; render(); }
  if(d.goal!==undefined) openGoal();
  if(d.unlock) openUnlock(d.unlock);
  if(d.more!==undefined){ VSHOW += 25; render(); }
  if(d.refresh!==undefined){ b.disabled = true; b.textContent = "Odświeżam…";
    api.call("POST","refresh").then(r=>toast(`Pobrano ${r.videos} filmów`)).catch(e=>toast("⚠ "+e.message)).finally(()=>load()); }
  if(d.close!==undefined) dlg.close();
  if(d.del && confirm("Usunąć ten film z planu?")) save("DELETE","projects/"+d.del,null,"Usunięto");
  if(d.delleave && confirm("Usunąć to wolne?")) save("DELETE","leaves/"+d.delleave,null,"Usunięto");
  if(d.undo && confirm("Cofnąć film z powrotem do produkcji?")) save("PUT","projects/"+d.undo,{status:"active",uploaded:null,actual_min:null},"Cofnięto");
  if(d.done) openDone(S.projects.find(p=>p.id==d.done));
  if(d.edit) openEdit(S.projects.find(p=>p.id==d.edit));
});
document.addEventListener("change", e => {
  const id = e.target.dataset && e.target.dataset.assign;
  if(!id || !e.target.value) return;
  save("POST","videos/"+id+"/assign",{member:e.target.value},"Autor przypisany");
});
const dlg = document.getElementById("dlg");
function openDone(p){
  dlg.innerHTML = `<h3>Wrzucony: ${esc(p.title)}</h3>
  <form id="fDone" data-id="${p.id}">
    <div class="row"><label>Data premiery<input type="date" name="uploaded" value="${today()}" required></label>
      <label>Faktyczna długość (min)<input type="number" name="actual_min" min="1" max="300" step="0.5" value="${p.planned_min}" required></label></div>
    <div class="row one"><label>Link do filmu (opcjonalnie)<input type="url" name="video_url" placeholder="https://youtu.be/…"></label></div>
    <div class="help" style="margin-bottom:12px">Od etapu 2 panel sam wykryje film na kanale. Ręczne oznaczenie zostaje jako zapas.</div>
    <button class="btn" type="submit">Zapisz</button> <button class="btn ghost" type="button" data-close>Anuluj</button>
  </form>`;
  dlg.showModal();
}
function openEdit(p){
  dlg.innerHTML = `<h3>Edycja filmu</h3>
  <form id="fEdit" data-id="${p.id}">
    <div class="row"><label>Kto<select name="member">${MEMBERS.map(m=>`<option ${m===p.member?"selected":""}>${m}</option>`).join("")}</select></label>
      <label>Start pracy<input type="date" name="start" value="${p.start}" required></label></div>
    <div class="row one"><label>Tytuł roboczy<input name="title" maxlength="200" value="${esc(p.title)}" required></label></div>
    <div class="row"><label>Planowana długość (min)<input type="number" name="planned_min" min="1" max="300" value="${p.planned_min}" required></label>
      <label class="chk" style="align-self:end;padding-bottom:8px"><input type="checkbox" name="wt" ${p.wt?"checked":""}> War Thunder</label></div>
    <button class="btn" type="submit">Zapisz</button> <button class="btn ghost" type="button" data-close>Anuluj</button>
  </form>`;
  dlg.showModal();
}
let tt;
function toast(m){ const el=document.getElementById("toast"); el.textContent=m; el.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("on"),2600); }

load();
setInterval(()=>{ if(!DEMO && !dlg.open && !document.querySelector("select:focus")) load(); }, 120000);
</script>
</body>
